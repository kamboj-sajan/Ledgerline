name: ledgerline

services:
  postgres:
    image: postgres:17-alpine # keep in step with internal/store/storetest.Image
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "${LEDGERLINE_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies migrations, then exits. Later services depend on it
  # completing successfully.
  migrate:
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The API. Starts once migrations have finished successfully.
  serve:
    build: .
    command: ["serve", "-addr", ":8080"]
    environment:
      # pgx pool size; 8 matches pgx's own default here (max(4, CPUs)).
      # docs/benchmarks.md compares it with 32.
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline?sslmode=disable&pool_max_conns=${LEDGERLINE_POOL_MAX_CONNS:-8}
    ports:
      - "${LEDGERLINE_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Delivers webhooks from the outbox. Scale with: docker compose up --scale dispatch=3
  dispatch:
    build: .
    command: ["dispatch"]
    environment:
      DATABASE_URL: postgres://ledgerline:ledgerline@postgres:5432/ledgerline?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
